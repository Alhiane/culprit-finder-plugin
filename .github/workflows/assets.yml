name: Update WordPress.org readme and assets

on:
  push:
    branches: [main]
    paths:
      - readme.txt
      - .wordpress-org/**

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update readme and assets on WordPress.org
        uses: 10up/action-wordpress-plugin-asset-update@2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: culprit-finder
          IGNORE_OTHER_FILES: true
